<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATS Decision Review Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .header {
            background: #1e293b;
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.5rem; color: #60a5fa; }
        .status-badge {
            background: #10b981;
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
        .card h2 { font-size: 1.125rem; color: #94a3b8; margin-bottom: 1rem; }
        .metric { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
        .metric:last-child { border-bottom: none; }
        .metric-value { color: #60a5fa; font-weight: 600; }
        .filters {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters input, .filters select {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 0.5rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .filters button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .filters button:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; font-size: 0.875rem; }
        td { font-size: 0.875rem; }
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-buy { background: #065f46; color: #6ee7b7; }
        .badge-sell { background: #7f1d1d; color: #fca5a5; }
        .badge-hold { background: #713f12; color: #fde047; }
        .badge-review { background: #ea580c; color: #fed7aa; }
        .badge-reviewed { background: #059669; color: #d1fae5; }
        .actions { display: flex; gap: 0.5rem; }
        .actions button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .actions button:hover { background: #475569; }
        .actions button.primary { background: #3b82f6; }
        .actions button.primary:hover { background: #2563eb; }
        .actions button.danger { background: #dc2626; }
        .actions button.danger:hover { background: #b91c1c; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h2 { color: #60a5fa; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #94a3b8; }
        .loading { text-align: center; padding: 2rem; color: #94a3b8; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>DATS Decision Review Dashboard</h1>
        <span class="status-badge" id="system-status">Loading...</span>
    </div>

    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>Pipeline Summary</h2>
                <div id="pipeline-summary">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div class="card">
                <h2>System Status</h2>
                <div id="system-summary">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div class="card">
                <h2>Portfolio Summary</h2>
                <div id="portfolio-summary">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div class="filters">
            <input type="text" id="filter-symbol" placeholder="Symbol (e.g. AAPL)" />
            <select id="filter-strategy">
                <option value="">All Strategies</option>
            </select>
            <select id="filter-status">
                <option value="">All Status</option>
                <option value="REVIEW_REQUIRED">Review Required</option>
                <option value="REVIEWED">Reviewed</option>
            </select>
            <button onclick="loadDecisions()">Filter</button>
            <button onclick="exportAll()">Export All Pending</button>
        </div>

        <div class="card">
            <h2>Decisions</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Symbol</th>
                        <th>Time</th>
                        <th>Strategy</th>
                        <th>Signal</th>
                        <th>Confidence</th>
                        <th>PnL</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="decisions-table">
                    <tr><td colspan="9" class="loading">Loading decisions...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Decision Detail</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        async function postJSON(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        async function loadSystemStatus() {
            try {
                const data = await fetchJSON(`${API_BASE}/status/`);
                document.getElementById('system-status').textContent = data.state;
                document.getElementById('system-status').style.background = data.is_running ? '#10b981' : '#dc2626';
                document.getElementById('system-summary').innerHTML = `
                    <div class="metric"><span>State</span><span class="metric-value">${data.state}</span></div>
                    <div class="metric"><span>Uptime</span><span class="metric-value">${data.uptime_seconds?.toFixed(1) || 0}s</span></div>
                    <div class="metric"><span>Running</span><span class="metric-value">${data.is_running}</span></div>
                `;
            } catch (e) {
                document.getElementById('system-status').textContent = 'Offline';
                document.getElementById('system-status').style.background = '#dc2626';
            }
        }

        async function loadPipelineSummary() {
            try {
                const data = await fetchJSON(`${API_BASE}/decisions/summary/pipeline`);
                document.getElementById('pipeline-summary').innerHTML = `
                    <div class="metric"><span>Total</span><span class="metric-value">${data.total_decisions_recorded || 0}</span></div>
                    <div class="metric"><span>Pending Review</span><span class="metric-value" style="color:#f59e0b">${data.pending_reviews || 0}</span></div>
                    <div class="metric"><span>Reviewed</span><span class="metric-value" style="color:#10b981">${data.reviewed || 0}</span></div>
                `;
            } catch (e) {
                document.getElementById('pipeline-summary').innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadPortfolio() {
            try {
                const data = await fetchJSON(`${API_BASE}/portfolio/summary`);
                document.getElementById('portfolio-summary').innerHTML = `
                    <div class="metric"><span>Cash</span><span class="metric-value">$${(data.cash || 0).toFixed(2)}</span></div>
                    <div class="metric"><span>Total Value</span><span class="metric-value">$${(data.total_value || 0).toFixed(2)}</span></div>
                    <div class="metric"><span>P&L</span><span class="metric-value" style="color:${(data.total_pnl || 0) >= 0 ? '#10b981' : '#dc2626'}">$${(data.total_pnl || 0).toFixed(2)}</span></div>
                    <div class="metric"><span>Positions</span><span class="metric-value">${data.position_count || 0}</span></div>
                `;
            } catch (e) {
                document.getElementById('portfolio-summary').innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadDecisions() {
            const symbol = document.getElementById('filter-symbol').value;
            const status = document.getElementById('filter-status').value;
            const tbody = document.getElementById('decisions-table');
            tbody.innerHTML = '<tr><td colspan="9" class="loading">Loading...</td></tr>';

            try {
                let url = `${API_BASE}/decisions/?limit=100`;
                if (symbol) url += `&symbol=${encodeURIComponent(symbol)}`;
                const data = await fetchJSON(url);

                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:#94a3b8">No decisions found</td></tr>';
                    return;
                }

                tbody.innerHTML = data.records.map(r => {
                    const signal = r.features?.signal > 0 ? 'BUY' : r.features?.signal < 0 ? 'SELL' : 'HOLD';
                    const signalClass = signal === 'BUY' ? 'badge-buy' : signal === 'SELL' ? 'badge-sell' : 'badge-hold';
                    const reviewStatus = r.outcome ? 'REVIEWED' : 'REVIEW_REQUIRED';
                    const reviewClass = reviewStatus === 'REVIEWED' ? 'badge-reviewed' : 'badge-review';
                    const date = r.timestamp ? new Date(r.timestamp * 1000).toLocaleString() : 'N/A';

                    return `<tr>
                        <td>${r.decision_id?.substring(0, 20) || 'N/A'}...</td>
                        <td>${r.symbol || 'N/A'}</td>
                        <td>${date}</td>
                        <td>${r.strategy || 'N/A'}</td>
                        <td><span class="badge ${signalClass}">${signal}</span></td>
                        <td>${(r.confidence || 0).toFixed(2)}</td>
                        <td style="color:${(r.realized_pnl || 0) >= 0 ? '#10b981' : '#dc2626'}">${(r.realized_pnl || 0).toFixed(2)}</td>
                        <td><span class="badge ${reviewClass}">${reviewStatus}</span></td>
                        <td class="actions">
                            <button onclick="viewDetail('${r.decision_id}')">View</button>
                            <button class="primary" onclick="markReviewed('${r.decision_id}')">Review</button>
                            <button class="danger" onclick="exportDecision('${r.decision_id}')">Export</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="9" class="error">Error: ${e.message}</td></tr>`;
            }
        }

        async function viewDetail(decisionId) {
            try {
                const data = await fetchJSON(`${API_BASE}/decisions/${decisionId}`);
                document.getElementById('modal-body').innerHTML = Object.entries(data).map(([k, v]) => {
                    let val = v;
                    if (typeof v === 'object' && v !== null) val = JSON.stringify(v, null, 2);
                    return `<div class="detail-row"><span class="detail-label">${k}</span><span>${val}</span></div>`;
                }).join('');
                document.getElementById('detail-modal').classList.add('active');
            } catch (e) {
                alert('Failed to load detail: ' + e.message);
            }
        }

        async function markReviewed(decisionId) {
            try {
                await postJSON(`${API_BASE}/decisions/${decisionId}/review`, { reviewer: 'dashboard_user', notes: 'Reviewed via dashboard' });
                loadDecisions();
                loadPipelineSummary();
            } catch (e) {
                alert('Failed to mark reviewed: ' + e.message);
            }
        }

        async function exportDecision(decisionId) {
            try {
                const data = await fetchJSON(`${API_BASE}/decisions/${decisionId}/export`);
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `decision-${decisionId}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Failed to export: ' + e.message);
            }
        }

        async function exportAll() {
            try {
                const data = await fetchJSON(`${API_BASE}/decisions/?limit=1000`);
                const pending = (data.records || []).filter(r => !r.outcome);
                const blob = new Blob([JSON.stringify({ decisions: pending }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pending-decisions-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Failed to export: ' + e.message);
            }
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        // Initial load
        loadSystemStatus();
        loadPipelineSummary();
        loadPortfolio();
        loadDecisions();

        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadSystemStatus();
            loadPipelineSummary();
            loadPortfolio();
        }, 5000);
    </script>
</body>
</html>
