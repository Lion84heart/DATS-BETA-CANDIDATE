[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dats-beta-candidate"
version = "1.0.0-beta"
description = "DATS AI Trading Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "DATS Engineering", email = "eng@dats.dev" },
]
keywords = ["trading", "ai", "infrastructure", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Data validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache
    "redis>=5.0.0",

    # Messaging
    "aiokafka>=0.10.0",

    # Structured logging
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",

    # Metrics
    "prometheus-client>=0.20.0",

    # HTTP client
    "httpx>=0.27.0",

    # Data analysis & feature engineering
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Statistical analysis — required by trading.ab_testing, trading.risk.risk_metrics
    "scipy>=1.12.0",

    # JWT authentication — required by api.auth
    "python-jose[cryptography]>=3.3.0",

    # TUI terminal interface
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Linting & formatting
    "ruff>=0.4.0",

    # Type checking
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/dats/dats"
Documentation = "https://docs.dats.dev"
Repository = "https://github.com/dats/dats.git"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests (fast, no external services)",
    "integration: Integration tests (require external services)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:aiokafka.*:",
    "ignore::DeprecationWarning:redis.*:",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 1
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "S",
]
ignore = [
    "S101",
    "S311",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
