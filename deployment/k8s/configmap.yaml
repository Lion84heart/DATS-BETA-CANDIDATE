---
# DATS-BETA-CANDIDATE ConfigMap
# Purpose: Stores non-sensitive application configuration.
# Update values here and restart pods to apply changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dats-beta-candidate-config
  namespace: dats-beta-candidate
  labels:
    app.kubernetes.io/name: dats-beta-candidate
    app.kubernetes.io/component: config
data:
  # Application identity
  APP_NAME: "DATS-BETA-CANDIDATE"
  APP_VERSION: "1.0.0-beta"
  APP_ENV: "production"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Server configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"

  # Static files and TUI paths (relative to container WORKDIR)
  STATIC_DIR: "/app/src/api/static"
  TUI_PATH: "/app/tui/main.py"

  # Feature flags
  ENABLE_METRICS: "true"
  ENABLE_CORS: "true"
  ENABLE_SWAGGER: "true"

  # Timezone
  TZ: "UTC"
