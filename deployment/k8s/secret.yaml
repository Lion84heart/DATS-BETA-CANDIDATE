---
# DATS-BETA-CANDIDATE Secret Template
# Purpose: Stores sensitive configuration (API keys, database credentials, signing keys).
# WARNING: Replace ALL placeholder base64 values with real secrets before deploying.
# Use the following command to encode a value:
#   echo -n 'your-secret-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: dats-beta-candidate-secrets
  namespace: dats-beta-candidate
  labels:
    app.kubernetes.io/name: dats-beta-candidate
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # --- Database ---
  # PostgreSQL / SQLite connection string or individual components
  DATABASE_URL: "postgresql://user:password@postgres:5432/dats_beta"
  # DATABASE_HOST: "postgres"
  # DATABASE_PORT: "5432"
  # DATABASE_NAME: "dats_beta"
  # DATABASE_USER: "dats_user"
  # DATABASE_PASSWORD: "CHANGEME"

  # --- Redis ---
  REDIS_URL: "redis://redis:6379/0"
  # REDIS_HOST: "redis"
  # REDIS_PORT: "6379"
  # REDIS_PASSWORD: "CHANGEME"

  # --- Security ---
  # JWT / session signing key — generate a strong random string
  SECRET_KEY: "CHANGEME-generate-a-256-bit-random-key"
  # API key for external data providers (e.g., market data feed)
  MARKET_DATA_API_KEY: "CHANGEME"
  # Broker / exchange API credentials
  BROKER_API_KEY: "CHANGEME"
  BROKER_API_SECRET: "CHANGEME"

  # --- External Services ---
  # OpenAI / LLM provider API key
  OPENAI_API_KEY: "CHANGEME"
  # Optional: Azure OpenAI endpoint
  # AZURE_OPENAI_ENDPOINT: "CHANGEME"
  # AZURE_OPENAI_KEY: "CHANGEME"

  # --- Notifications ---
  # SMTP / email credentials (optional)
  # SMTP_HOST: "smtp.example.com"
  # SMTP_PORT: "587"
  # SMTP_USER: "alerts@example.com"
  # SMTP_PASSWORD: "CHANGEME"

  # Slack / webhook token (optional)
  # SLACK_WEBHOOK_URL: "CHANGEME"

  # --- TLS / Certificates (optional) ---
  # TLS_CERT: "CHANGEME"
  # TLS_KEY: "CHANGEME"
