---
# DATS-BETA-CANDIDATE HorizontalPodAutoscaler
# Purpose: Automatically scales the API Deployment based on CPU and memory utilization.
# Min replicas: 2 (for HA), Max replicas: 10 (production ceiling).
# Adjust thresholds and metrics to match your workload profile.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dats-beta-candidate
  namespace: dats-beta-candidate
  labels:
    app.kubernetes.io/name: dats-beta-candidate
    app.kubernetes.io/component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dats-beta-candidate
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
